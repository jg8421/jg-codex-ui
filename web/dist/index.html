    <script>
      (() => {
        // 防御性兜底：部分浏览器/插件会注入 `window.__firefox__`，并尝试调用 `searchLoginField()`。
        // 当注入对象存在但函数缺失时，会在控制台抛出：
        // `window.__firefox__.searchLoginField is not a function`
        // 这里做最小 no-op 补全，避免影响页面正常运行与调试体验。
        const anyWindow = window;
        const firefoxApi = anyWindow.__firefox__;
        if (firefoxApi && typeof firefoxApi === "object" && typeof firefoxApi.searchLoginField !== "function") {
          firefoxApi.searchLoginField = () => {};
        }
      })();
    </script>
    <script>
      (() => {
        // 与前端主题枚举对应：用于首屏前同步浏览器栏位颜色。
        const themeColorByTheme = {
          light: "#ffffff",
          dark: "#0d1422",
        };
        // 统一颜色格式校验：允许 #RGB / #RRGGBB。
        const hexColorPattern = /^#(?:[0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/;
        // 统一颜色规范化：全部转成 #rrggbb，保证 CSS 变量与 meta 一致。
        const normalizeHexColor = (value) => {
          if (typeof value !== "string") return null;
          const rawColor = value.trim();
          if (!hexColorPattern.test(rawColor)) return null;
          if (rawColor.length === 7) return rawColor.toLowerCase();
          const short = rawColor.slice(1).toLowerCase();
          return `#${short[0]}${short[0]}${short[1]}${short[1]}${short[2]}${short[2]}`;
        };
        // IDEA 插件模式：通过 query 下发 IDE 当前主题与背景色，避免首屏先使用浏览器遗留配置。
        const searchParams = new URLSearchParams(window.location.search.startsWith("?") ? window.location.search : `?${window.location.search}`);
        const isIdeaClient = String(searchParams.get("client") ?? "").trim().toLowerCase() === "idea";
        const rawIdeaTheme = String(searchParams.get("ideTheme") ?? "").trim().toLowerCase();
        const forcedIdeaTheme = Object.prototype.hasOwnProperty.call(themeColorByTheme, rawIdeaTheme) ? rawIdeaTheme : null;
        const forcedIdeaBackgroundColor = normalizeHexColor(searchParams.get("ideBackgroundColor"));
        // 读取用户上次选择的主题，避免首屏先闪到默认 light；未设置时跟随系统配色。
        const persistedTheme = isIdeaClient && forcedIdeaTheme ? forcedIdeaTheme : window.localStorage.getItem("theme");
        const hasTheme = Object.prototype.hasOwnProperty.call(themeColorByTheme, persistedTheme);
        const prefersDark = typeof window.matchMedia === "function" && window.matchMedia("(prefers-color-scheme: dark)").matches;
        const safeTheme = hasTheme ? persistedTheme : prefersDark ? "dark" : "light";
        document.documentElement.dataset.theme = safeTheme;

        // 首屏前读取突出色并写入样式变量，减少刷新时高亮色闪动。
        const persistedAccentColor = normalizeHexColor(window.localStorage.getItem("accentColor"));
        const rootStyle = document.documentElement.style;
        if (persistedAccentColor) {
          const safeAccentColor = persistedAccentColor;
          const red = Number.parseInt(safeAccentColor.slice(1, 3), 16);
          const green = Number.parseInt(safeAccentColor.slice(3, 5), 16);
          const blue = Number.parseInt(safeAccentColor.slice(5, 7), 16);
          rootStyle.setProperty("--user-accent", safeAccentColor);
          rootStyle.setProperty("--user-accent-soft", `rgba(${red}, ${green}, ${blue}, 0.18)`);
          rootStyle.setProperty("--user-accent-strong", `rgba(${red}, ${green}, ${blue}, 0.28)`);
        } else {
          rootStyle.removeProperty("--user-accent");
          rootStyle.removeProperty("--user-accent-soft");
          rootStyle.removeProperty("--user-accent-strong");
        }

        // 首屏前读取当前主题的背景色并写入变量：
        // - 优先使用主题专属键（backgroundColor:light / backgroundColor:dark）
        // - 仅在专属键缺失时，把旧版全局键迁移到“当前主题”，并删除旧键，避免暗黑模式串色
        const themeBackgroundStorageKey = `backgroundColor:${safeTheme}`;
        let persistedBackgroundColor = null;
        if (isIdeaClient && forcedIdeaTheme) {
          window.localStorage.setItem("theme", forcedIdeaTheme);
          window.localStorage.removeItem("backgroundColor");
          if (forcedIdeaBackgroundColor) {
            window.localStorage.setItem(themeBackgroundStorageKey, forcedIdeaBackgroundColor);
            persistedBackgroundColor = forcedIdeaBackgroundColor;
          } else {
            window.localStorage.removeItem(themeBackgroundStorageKey);
          }
        } else {
          const otherThemeBackgroundStorageKey = safeTheme === "dark" ? "backgroundColor:light" : "backgroundColor:dark";
          const legacyBackgroundColor = normalizeHexColor(window.localStorage.getItem("backgroundColor"));
          const otherThemeBackgroundColor = normalizeHexColor(window.localStorage.getItem(otherThemeBackgroundStorageKey));
          persistedBackgroundColor = normalizeHexColor(window.localStorage.getItem(themeBackgroundStorageKey));

          if (persistedBackgroundColor) {
            if (
              legacyBackgroundColor &&
              otherThemeBackgroundColor &&
              legacyBackgroundColor === persistedBackgroundColor &&
              legacyBackgroundColor === otherThemeBackgroundColor
            ) {
              window.localStorage.removeItem(otherThemeBackgroundStorageKey);
            }
            if (legacyBackgroundColor) window.localStorage.removeItem("backgroundColor");
          } else if (legacyBackgroundColor) {
            window.localStorage.setItem(themeBackgroundStorageKey, legacyBackgroundColor);
            window.localStorage.removeItem("backgroundColor");
            persistedBackgroundColor = legacyBackgroundColor;
          }
        }
        if (persistedBackgroundColor) rootStyle.setProperty("--user-bg", persistedBackgroundColor);
        else rootStyle.removeProperty("--user-bg");
        const browserThemeColor = persistedBackgroundColor ?? themeColorByTheme[safeTheme] ?? themeColorByTheme.light;

        let themeColorMeta = document.querySelector('meta[name="theme-color"]');
        if (!(themeColorMeta instanceof HTMLMetaElement)) {
          themeColorMeta = document.createElement("meta");
          themeColorMeta.setAttribute("name", "theme-color");
          document.head.appendChild(themeColorMeta);
        }
        themeColorMeta.setAttribute("content", browserThemeColor);
      })();
    </script>
